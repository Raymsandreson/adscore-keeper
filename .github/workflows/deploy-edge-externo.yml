# Edge function do Supabase Externo não sobe sozinha.
#
# O Railway auto-deploya `railway-server/` a cada merge em `main`, e por causa
# disso é fácil supor que TUDO sobe sozinho. Não sobe: as funções em
# `supabase/functions/_external/` iam para produção pela Management API, na mão,
# por scripts `_deploy_*.mjs` avulsos na raiz do repo. Quem esquecesse do passo
# manual ficava com o código no git e o comportamento antigo em produção — o
# pior tipo de divergência, porque o repo diz que está consertado.
#
# Este workflow fecha isso: merge em `main` que toque `_external/` deploya só as
# funções que o diff mudou.
#
# Duas coisas que ele PRECISA para funcionar, as duas descobertas quebradas em
# 08/09/2026:
#
# 1. O secret `SUPABASE_PAT`. Sem ele o job falha na primeira linha — foi o que
#    aconteceu em todos os runs até aqui (8, 9, 10). O código ia para `main` e
#    a função seguia com a versão antiga no ar: exatamente a divergência que
#    este arquivo foi escrito para acabar.
#
# 2. A base do diff. Era `HEAD~1`, que num merge commit é o primeiro pai — ou
#    seja, a ponta da branch que está entrando, não o `main` de antes. O diff
#    saía vazio e o deploy dizia "nada a fazer" mesmo com a função mudada.
#    `github.event.before` é o `main` que estava publicado antes deste push, que
#    é a pergunta certa: o que entrou em produção agora.
name: Deploy edge functions do Externo

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_external/**'
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Funções a deployar (separadas por espaço). Vazio = as que mudaram no último commit.'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro: `github.event.before` pode estar a vários commits
          # de distância num merge, e `fetch-depth: 2` deixava o diff sem base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
        run: |
          if [ -z "$SUPABASE_PAT" ]; then
            echo "::error::Falta o secret SUPABASE_PAT no repositório."
            echo "Crie em https://supabase.com/dashboard/account/tokens e adicione em"
            echo "Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          if [ -n "${{ inputs.slugs }}" ]; then
            node scripts/deploy-edge-externo.mjs ${{ inputs.slugs }}
          else
            node scripts/deploy-edge-externo.mjs --mudadas-desde ${{ github.event.before }}
          fi
